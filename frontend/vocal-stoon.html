<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------------
     Fictional municipality + product constants
  --------------------------------------------------------------------- */
  var MUNICIPALITY = "Saskatoon";
  // The real council signup code now lives server-side only (the
  // `app.council_code` Postgres setting in 0001_init.sql) and is checked
  // inside sign_up() — the client just forwards whatever was typed and
  // shows the server's answer, so nothing secret ships in this file.
  var CAT_COLORS = ["var(--cat-1)","var(--cat-2)","var(--cat-3)","var(--cat-4)","var(--cat-5)","var(--cat-6)"];
  // Fictional ridings/wards — invented names, not real Saskatoon ward
  // boundaries, consistent with this being an independent prototype.
  var RIDINGS = ["Fairhaven","Riverbend","Northgate","Elm Terrace","Cedar Flats","Downtown Core","Southbridge","Willowdale"];

  // A poll with no `eligibleRidings` (or an empty one) is citywide — every
  // verified resident can see and vote on it. Otherwise only residents
  // whose own declared riding is in that list can.
  function pollVisibleToResident(poll, resident){
    if(!poll.eligibleRidings || !poll.eligibleRidings.length) return true;
    if(!resident || !resident.riding) return false;
    return poll.eligibleRidings.indexOf(resident.riding) !== -1;
  }
  function pollAreaLabel(poll){
    if(!poll.eligibleRidings || !poll.eligibleRidings.length) return 'Citywide';
    return poll.eligibleRidings.join(', ');
  }

  var money = new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 });
  function fmtMoney(n){ return money.format(Number(n)||0); }
  function fmtDate(iso){ if(!iso) return ''; var d = new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString(undefined,{ month:'short', day:'numeric', year:'numeric' }); }
  function fmtDateTime(iso){ if(!iso) return ''; var d = new Date(iso); if(isNaN(d)) return ''; return d.toLocaleString(undefined,{ month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
  function daysLeft(iso){ if(!iso) return null; var ms = new Date(iso).getTime() - Date.now(); return Math.ceil(ms/86400000); }
  function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now()); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function slug(s){ return String(s||'').toLowerCase().trim().replace(/[^a-z0-9_\-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60); }

  // Resident ids are now generated by the database (see the `residents`
  // table default in 0001_init.sql) — the client never invents one.
  // Sign-in matches on full name + address + ward + password now, with
  // whitespace/case forgiveness on name and address — but the matching
  // itself runs server-side in sign_in() (0001_init.sql), via that
  // migration's own normalize_text() SQL function, not here.

  // Client-side-only record of a resident's own past choices. Never written
  // to the shared store — see the ballot anonymization note above castVote().
  var MY_VOTES_KEY = 'vocalstoon_myvotes_v1';
  function loadMyVotes(){ try{ return JSON.parse(localStorage.getItem(MY_VOTES_KEY) || '{}'); }catch(e){ return {}; } }
  function saveMyVote(pollId, optionId){ try{ var m = loadMyVotes(); m[pollId] = optionId; localStorage.setItem(MY_VOTES_KEY, JSON.stringify(m)); }catch(e){} }

  // Client-side-only record of which "new vote opened" notifications this
  // resident has already seen, keyed by resident id (a device can host more
  // than one test account, so this — unlike MY_VOTES_KEY above — is scoped
  // per resident rather than shared across whoever is signed in).
  var NOTIFS_SEEN_KEY = 'vocalstoon_notifs_seen_v1';
  function loadSeenNotifs(residentId){
    try{ var all = JSON.parse(localStorage.getItem(NOTIFS_SEEN_KEY) || '{}'); return all[residentId] || []; }catch(e){ return []; }
  }
  function markNotifsSeen(residentId, pollIds){
    if(!pollIds || !pollIds.length) return;
    try{
      var all = JSON.parse(localStorage.getItem(NOTIFS_SEEN_KEY) || '{}');
      var existing = all[residentId] || [];
      pollIds.forEach(function(id){ if(existing.indexOf(id) === -1) existing.push(id); });
      all[residentId] = existing;
      localStorage.setItem(NOTIFS_SEEN_KEY, JSON.stringify(all));
    }catch(e){}
  }

  function toast(msg){
    var wrap = document.getElementById('toastWrap');
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function(){ el.remove(); }, 4200);
  }

  /* ---------------------------------------------------------------------
     Supabase client
     Replaces both the Claude artifact `db` capability AND the
     localStorage-backed local-store fallback the standalone export used —
     there's exactly one real backend now, used the same way regardless of
     how someone reaches this page (hosted link, downloaded file, whatever).
     See ../SPEC.md "Auth model" for why this doesn't use Supabase's
     built-in email/password auth, and its "session table" note for why
     there's no JWT here at all — every RPC that needs to know who's
     calling takes the session token as a plain parameter instead of an
     Authorization header, so there's exactly one client instance, created
     once, never recreated on sign in/out.
  --------------------------------------------------------------------- */
  var sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
  });

  var SESSION_KEY = 'vocalstoon_session_v1';
  var CURRENT_TOKEN = null;   // the session token to attach to every RPC call that needs identity
  function saveSession(token, expiresAt){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ token: token, expiresAt: expiresAt })); }catch(e){} }
  function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ return null; } }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
  function sessionLooksValid(s){ return !!(s && s.token && s.expiresAt && new Date(s.expiresAt).getTime() > Date.now()); }
  function setSession(token, expiresAt){
    CURRENT_TOKEN = token || null;
    if(token){ saveSession(token, expiresAt); } else { clearSession(); }
  }
  // Merges the current session token into an RPC's params — every
  // identity-checking function in 0001_init.sql takes p_session_token.
  function withToken(params){ return Object.assign({ p_session_token: CURRENT_TOKEN }, params || {}); }

  // Turns a PostgREST/RPC error (see the `raise exception ... using
  // errcode` calls in 0001_init.sql) into the same user-facing wording the
  // prototype used, so none of the render code below needs to change.
  function rpcErrorMessage(e, fallback){
    if(!e) return fallback;
    var msg = e.message || (e.error && e.error.message) || '';
    return msg || fallback;
  }

  /* ---------------------------------------------------------------------
     App state
  --------------------------------------------------------------------- */
  var S = {
    view: 'login',            // login | signup | issued | verify | resident | vote | history | council
    councilTab: 'new',        // new | manage | verify
    currentUser: null,        // resident doc (with id)
    issuedId: null,           // resident id just generated at signup, shown once
    polls: [],                // all polls (live)
    residents: [],            // all residents (live, council-only fetch)
    activePollId: null,
    selectedOptionId: null,
    voteBusy: false,
    myBallots: {},            // pollId -> {optionId} — optionId comes from this device's own local record
    pollResults: {},          // pollId -> {counts:{optId:n}, total, eligible}
    unsubs: [],
    authError: '',
    authBusy: false,     // true while a sign-in/sign-up request is in flight
    authTab: 'signin',
    showCouncilCode: false,
    verifyStep: 0,            // 0 none,1 running doc check,2 running biometric,3 done
    newPollOptions: ['',''],
    expandedResults: {},      // pollId -> bool
    expandedRoster: false,
    justSignedUp: false,      // true for the one afterLogin() right after signup — seeds the notif baseline
    notifications: [],        // unread "new vote opened" items for the signed-in resident
    notifOpen: false
  };

  function clearSubs(){ S.unsubs.forEach(function(u){ try{u();}catch(e){} }); S.unsubs = []; }

  /* ---------------------------------------------------------------------
     Persistence helpers — session identity now lives in the session
     token (see setSession above), issued server-side by sign_in()/
     sign_up() in 0001_init.sql. A resident's password never touches this
     file.
  --------------------------------------------------------------------- */

  // Remembered separately from the active session so that, even after
  // signing out, this device can pre-fill everything but the password —
  // sign-in now matches on full name + address + ward + password together.
  var LAST_IDENTITY_KEY = 'vocalstoon_last_identity_v1';
  function rememberLastIdentity(fields){
    try{ localStorage.setItem(LAST_IDENTITY_KEY, JSON.stringify({ fullName: fields.fullName || '', address: fields.address || '', riding: fields.riding || '' })); }catch(e){}
  }
  function getLastIdentity(){ try{ return JSON.parse(localStorage.getItem(LAST_IDENTITY_KEY) || '{}'); }catch(e){ return {}; } }

  /* ---------------------------------------------------------------------
     Data access
     Everything below talks to Postgres via supabase-js — either plain
     table reads (RLS-gated) or the RPC functions in 0001_init.sql for
     anything that needs to be atomic or must not leak data the client
     shouldn't see (auth, votes, verification). The row<->app-object
     mapping functions keep every render function elsewhere in this file
     unchanged: they still work with the same camelCase field names as
     before (p.createdAt, r.verificationStatus, etc.), just backed by a
     real database now instead of the mock/local store.
  --------------------------------------------------------------------- */
  function rowToResident(row){
    if(!row) return row;
    return {
      id: row.id, fullName: row.full_name, address: row.address, city: row.city,
      postalCode: row.postal_code, riding: row.riding, jurisdiction: row.jurisdiction,
      role: row.role, verificationStatus: row.verification_status, verificationMethod: row.verification_method,
      submittedAt: row.submitted_at, verifiedAt: row.verified_at, verifiedBy: row.verified_by,
      createdAt: row.created_at
    };
  }
  function rowToPoll(row){
    if(!row) return row;
    return {
      id: row.id, title: row.title, description: row.description, category: row.category,
      budgetAmount: row.budget_amount, options: row.options, eligibleRidings: row.eligible_ridings,
      closesAt: row.closes_at, status: row.status, createdBy: row.created_by,
      createdAt: row.created_at, closedAt: row.closed_at
    };
  }

  // Assigned by subscribePolls() once a poll subscription is live; module-
  // scoped so createPoll/closePoll/reopenPoll can force an immediate
  // refresh after their own write instead of waiting on the realtime push.
  var refetchPolls = function(){ return Promise.resolve(); };

  function subscribePolls(){
    // Tracks whether this is the subscription's first callback so a poll
    // that already existed when we subscribed doesn't get announced as
    // "new" — only ones that show up while the resident is live in the app.
    var haveSeenFirstSnapshot = false;
    function applyRows(rows){
      var prevIds = S.polls.map(function(p){ return p.id; });
      S.polls = rows.map(rowToPoll).sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });
      if(haveSeenFirstSnapshot && S.currentUser && S.currentUser.role !== 'council'){
        S.polls.filter(function(p){
          return prevIds.indexOf(p.id) === -1 && p.status === 'open' && pollVisibleToResident(p, S.currentUser);
        }).forEach(function(p){ toast('New vote opened: ' + p.title); });
      }
      haveSeenFirstSnapshot = true;
      refreshMyBallots().then(function(){ refreshNotifications(); render(); });
    }
    refetchPolls = function(){
      return sb.from('polls').select('*').then(function(res){
        if(res.error){ toast('Votes list disconnected: ' + rpcErrorMessage(res.error, 'try reloading the page.')); return; }
        applyRows(res.data || []);
      });
    };
    refetchPolls();
    // Live push for new/changed polls — see SPEC.md "Realtime" for why
    // `polls` (not `residents`) is the table wired up this way. On any
    // change (from ANY signed-in client, not just this one) we just
    // refetch the whole (small) table rather than hand-patching one row
    // in place; simplest correct thing for a v1. createPoll/closePoll/
    // reopenPoll ALSO call refetchPolls() themselves right after their own
    // write, so the person who just made the change sees it instantly
    // instead of waiting on the realtime round trip.
    var channel = sb.channel('polls-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'polls' }, refetchPolls)
      .subscribe();
    S.unsubs.push(function(){ sb.removeChannel(channel); });
  }

  // Recomputes which open, ward-eligible votes the signed-in resident
  // hasn't dismissed yet — this is what drives the notification bell.
  // Council never gets a bell (this only matters for voters).
  function refreshNotifications(){
    if(!S.currentUser || S.currentUser.role === 'council'){ S.notifications = []; return; }
    var seen = loadSeenNotifs(S.currentUser.id);
    S.notifications = S.polls
      .filter(function(p){ return p.status === 'open' && pollVisibleToResident(p, S.currentUser) && seen.indexOf(p.id) === -1; })
      .sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });
  }

  // Council-only roster + pending-verification queue. Deliberately a
  // plain refetch, not a live subscription — see SPEC.md "Realtime" for
  // why `residents` is NOT wired up to Postgres Realtime (the table holds
  // home addresses and password hashes, and Realtime's own RLS enforcement
  // varies by Supabase project version; a stale-by-a-few-seconds roster is
  // a much smaller risk than getting that wrong). Re-called after every
  // council action that changes the roster, so it still feels live.
  function subscribeResidents(){ return refreshResidents(); }
  function refreshResidents(){
    if(!S.currentUser || S.currentUser.role !== 'council') return Promise.resolve();
    return sb.rpc('residents_roster', withToken()).then(function(res){
      if(res.error){ toast('Resident list disconnected: ' + rpcErrorMessage(res.error, 'try reloading the page.')); return; }
      S.residents = (res.data || []).map(rowToResident);
      render();
    });
  }

  // Replaces the old per-poll voters-collection loop with one RPC call.
  // NOTE: unlike the original client-side loop (which only checked polls
  // currently *open*), this now reflects every poll the resident has ever
  // voted on, open or closed — so "You voted: X" keeps showing correctly
  // in History after a vote closes, instead of only during a live session
  // that started before the poll closed. See SPEC.md changelog.
  function refreshMyBallots(){
    if(!S.currentUser) return Promise.resolve();
    var mine = loadMyVotes();
    return sb.rpc('my_voted_polls', withToken()).then(function(res){
      if(res.error) return;
      var votedIds = res.data || [];
      var next = {};
      votedIds.forEach(function(pollId){ next[pollId] = { optionId: mine[pollId] }; });
      S.myBallots = next;
    }).catch(function(){ /* leave voted-state as-is; not worth interrupting the dashboard for */ });
  }

  function computeResults(pollId){
    return sb.rpc('poll_results', withToken({ p_poll_id: pollId })).then(function(res){
      if(res.error){ toast('Could not load results: ' + rpcErrorMessage(res.error, 'please try again.')); return; }
      var r = res.data || {};
      S.pollResults[pollId] = { counts: r.counts || {}, total: r.total || 0, eligible: r.eligible || 0 };
      render();
    }).catch(function(e){ toast('Could not load results: ' + rpcErrorMessage(e, 'please try again.')); });
  }

  /* ---------------------------------------------------------------------
     Actions — auth
  --------------------------------------------------------------------- */
  function doSignIn(fields){
    var name = String(fields.fullName || '').trim();
    var address = String(fields.address || '').trim();
    var riding = fields.riding || '';
    var password = fields.password || '';
    if(!name || !address || !riding || !password){ S.authError = 'Enter your full name, address, ward, and password.'; return render(); }
    S.authBusy = true; S.authError = ''; render();
    // The match itself now happens entirely server-side inside sign_in()
    // (0001_init.sql) — this client never sees the roster or any password
    // hash, unlike the original prototype's "fetch everyone, scan for a
    // match" approach (fine inside the sandboxed Claude artifact; not
    // something to expose on a real public site).
    sb.rpc('sign_in', { p_full_name: name, p_address: address, p_riding: riding, p_password: password }).then(function(res){
      S.authBusy = false;
      if(res.error){ S.authError = rpcErrorMessage(res.error, 'Those details don\'t match an account.'); return render(); }
      var payload = res.data;
      setSession(payload.token, payload.expires_at);
      S.currentUser = rowToResident(payload.resident);
      S.authError = ''; rememberLastIdentity(S.currentUser);
      afterLogin();
    }).catch(function(e){
      S.authBusy = false;
      S.authError = 'Sign-in failed: ' + rpcErrorMessage(e, 'please try again.');
      render();
    });
  }

  function doSignUp(fields){
    if(!fields.password || fields.password.length < 6){ S.authError = 'Password must be at least 6 characters.'; return render(); }
    if(!fields.fullName || !fields.address){ S.authError = 'Full name and address are required.'; return render(); }
    var riding = RIDINGS.indexOf(fields.riding) !== -1 ? fields.riding : RIDINGS[0];

    S.authBusy = true; S.authError = ''; render();
    // sign_up() validates the council code server-side (against the
    // app.council_code Postgres setting) and hashes the password before
    // it ever touches a table — see 0001_init.sql.
    sb.rpc('sign_up', {
      p_full_name: fields.fullName, p_address: fields.address, p_city: fields.city || MUNICIPALITY,
      p_postal_code: fields.postalCode || '', p_riding: riding, p_password: fields.password,
      p_council_code: fields.councilCode || null
    }).then(function(res){
      S.authBusy = false;
      if(res.error){ S.authError = rpcErrorMessage(res.error, 'Could not create your account.'); return render(); }
      var payload = res.data;
      setSession(payload.token, payload.expires_at);
      var doc = rowToResident(payload.resident);
      S.currentUser = doc; S.authError = '';
      rememberLastIdentity(doc);
      S.issuedId = doc.id; S.view = 'issued'; S.justSignedUp = true;
      render();
    }).catch(function(e){
      S.authBusy = false;
      S.authError = 'Could not create your account: ' + rpcErrorMessage(e, 'please try again.');
      render();
    });
  }

  // Every sign-in — not just the first one — routes a resident through the
  // identity check before their dashboard. New/pending accounts still get
  // the deliberate "click to begin" first-time flow; an already-verified
  // resident's re-check kicks off immediately (see the auto-start in
  // proceed() below), since at that point it's just a mandatory formality.
  function afterLogin(){
    S.verifyStep = 0;
    var isCouncil = S.currentUser.role === 'council';
    S.view = isCouncil ? 'council' : 'verify';
    render();

    function proceed(){
      subscribePolls();
      if(isCouncil) subscribeResidents();
      render();
      if(!isCouncil && S.currentUser.verificationStatus === 'verified') beginVerification();
    }

    if(!isCouncil && S.justSignedUp){
      // Baseline the brand-new resident's "seen" notifications against
      // whatever's already open right now, so their very first dashboard
      // doesn't read as a pile of "new" votes that predate them — only
      // votes opened from here on should ever notify them.
      S.justSignedUp = false;
      sb.from('polls').select('*').then(function(res){
        var openVisibleIds = (res.data || [])
          .map(rowToPoll)
          .filter(function(p){ return p.status === 'open' && pollVisibleToResident(p, S.currentUser); })
          .map(function(p){ return p.id; });
        markNotifsSeen(S.currentUser.id, openVisibleIds);
      }).catch(function(){ /* baseline seeding is a nicety; skip silently on failure */ }).then(proceed);
    } else {
      proceed();
    }
  }

  function doSignOut(){
    clearSubs();
    // Best-effort — actually deletes the session row server-side so a
    // copied/leaked token can't be replayed after this point, unlike a
    // JWT (which would stay valid until it expired regardless). Don't
    // block the UI on it either way; the local token is cleared next.
    if(CURRENT_TOKEN) sb.rpc('sign_out', withToken()).catch(function(){});
    setSession(null);
    S = Object.assign({}, S, { currentUser:null, view:'login', authTab:'signin', authError:'', polls:[], residents:[], myBallots:{}, pollResults:{}, notifications:[], notifOpen:false });
    render();
  }

  /* ---------------------------------------------------------------------
     Actions — simulated identity verification
     No real photo, document, or biometric data is captured or stored by
     this prototype — the multi-step check below is a timed simulation so
     the workflow can be demonstrated. A production deployment would call
     a certified identity-verification provider here instead. Every sign-in
     runs this, not just the first — an already-verified resident's run
     just skips the write below since there's nothing new to persist.
  --------------------------------------------------------------------- */
  function beginVerification(){
    S.verifyStep = 1; render();
    setTimeout(function(){
      S.verifyStep = 2; render();
      setTimeout(function(){
        S.verifyStep = 3; render();
        if(S.currentUser.verificationStatus === 'verified'){
          setTimeout(function(){ S.view = 'resident'; render(); }, 900);
          return;
        }
        // complete_self_verification() (0001_init.sql) can only flip the
        // CALLER's own row to 'verified' — it can't touch anyone else's
        // row and can't set 'rejected', so this self-service simulated
        // flow can't be pointed at another resident the way a plain
        // client-side update could have been. See SPEC.md "Before this
        // decides a real vote" for why the simulation itself should
        // eventually be replaced with a real ID-verification provider.
        sb.rpc('complete_self_verification', withToken()).then(function(res){
          if(res.error){
            S.verifyStep = 0;
            toast('Verification could not be saved: ' + rpcErrorMessage(res.error, 'please try again.'));
            return render();
          }
          S.currentUser.verificationStatus = 'verified';
          setTimeout(function(){ S.view = 'resident'; render(); }, 900);
        }).catch(function(e){
          S.verifyStep = 0;
          toast('Verification could not be saved: ' + rpcErrorMessage(e, 'please try again.'));
          render();
        });
      }, 1400);
    }, 1300);
  }

  function councilSetVerification(residentId, status){
    sb.rpc('council_set_verification', withToken({ p_resident_id: residentId, p_status: status })).then(function(res){
      if(res.error){ toast('Could not update this application: ' + rpcErrorMessage(res.error, 'please try again.')); return; }
      toast(status === 'verified' ? 'Resident approved.' : 'Resident application rejected.');
      refreshResidents();
    }).catch(function(e){ toast('Could not update this application: ' + rpcErrorMessage(e, 'please try again.')); });
  }

  /* ---------------------------------------------------------------------
     Actions — voting
     Secret ballot, same guarantee as before: the `poll_voters` flag (this
     resident id has voted, no choice attached) and the anonymous
     `poll_ballots` row (a choice, no resident reference at all) are
     written together, atomically, by the cast_vote() RPC in
     0001_init.sql — see that file's comments for why this closes a real
     race condition the original client-side check-then-write pattern had.
  --------------------------------------------------------------------- */
  function castVote(pollId, optionId){
    if(!optionId) return;
    var poll = S.polls.filter(function(p){ return p.id===pollId; })[0];
    if(poll && !pollVisibleToResident(poll, S.currentUser)){ toast('This vote is not open to your ward.'); S.view='resident'; return render(); }
    S.voteBusy = true; render();
    sb.rpc('cast_vote', withToken({ p_poll_id: pollId, p_option_id: optionId })).then(function(res){
      S.voteBusy = false;
      if(res.error){
        var msg = rpcErrorMessage(res.error, 'Your vote could not be recorded.');
        toast(msg);
        if(/already voted/i.test(msg) || /not open to your ward/i.test(msg)) S.view = 'resident';
        return render();
      }
      saveMyVote(pollId, optionId);
      S.myBallots[pollId] = { optionId: optionId };
      S.view = 'resident'; S.activePollId = null; S.selectedOptionId = null;
      toast('Your vote has been recorded.');
      render();
    }).catch(function(e){
      S.voteBusy = false;
      toast('Your vote could not be recorded: ' + rpcErrorMessage(e, 'please try again.'));
      render();
    });
  }

  /* ---------------------------------------------------------------------
     Actions — council: create / manage polls
  --------------------------------------------------------------------- */
  function createPoll(fields){
    var opts = (fields.options || []).map(function(t){ return t.trim(); }).filter(Boolean);
    if(!fields.title || !fields.description){ toast('Title and description are required.'); return; }
    if(opts.length < 2){ toast('Add at least two options.'); return; }
    if(!fields.closesAt){ toast('Set a closing date.'); return; }
    var ridings = (fields.ridings || []).filter(function(w){ return RIDINGS.indexOf(w) !== -1; });
    if(fields.ridingScope === 'specific' && ridings.length === 0){ toast('Select at least one ward, or switch back to all of ' + MUNICIPALITY + '.'); return; }
    var options = opts.slice(0,6).map(function(label){ return { id: uid(), label: label }; });
    // A plain sb.from('polls').insert(...) can't be authorized any more —
    // there's no JWT-verified role for an is_council() RLS policy to check
    // (see SPEC.md's auth-model note) — so this goes through the
    // create_poll() RPC instead, which checks the caller's session token
    // itself and is the only way to write a poll now.
    sb.rpc('create_poll', withToken({
      p_title: fields.title, p_description: fields.description, p_category: fields.category || 'General',
      p_budget_amount: Number(fields.budgetAmount) || 0, p_options: options,
      p_eligible_ridings: fields.ridingScope === 'specific' ? ridings : null,
      p_closes_at: new Date(fields.closesAt).toISOString()
    })).then(function(res){
      if(res.error){ toast('Could not publish this vote: ' + rpcErrorMessage(res.error, 'please try again.')); return; }
      toast('Vote published — residents will see it now.');
      S.newPollOptions = ['','']; S.councilTab = 'manage';
      // Don't wait on the realtime round trip to see your own new poll —
      // refetch right away (other signed-in residents/council still get it
      // via the realtime channel a moment later).
      refetchPolls().then(render);
    }).catch(function(e){ toast('Could not publish this vote: ' + rpcErrorMessage(e, 'please try again.')); });
  }

  function closePoll(pollId){
    sb.rpc('set_poll_status', withToken({ p_poll_id: pollId, p_status: 'closed' })).then(function(res){
      if(res.error){ toast('Could not close voting: ' + rpcErrorMessage(res.error, 'please try again.')); return; }
      toast('Voting closed.');
      refetchPolls().then(function(){ computeResults(pollId); });
    }).catch(function(e){ toast('Could not close voting: ' + rpcErrorMessage(e, 'please try again.')); });
  }

  function reopenPoll(pollId){
    sb.rpc('set_poll_status', withToken({ p_poll_id: pollId, p_status: 'open' })).then(function(res){
      if(res.error){ toast('Could not reopen this vote: ' + rpcErrorMessage(res.error, 'please try again.')); return; }
      toast('Vote reopened.');
      refetchPolls();
    }).catch(function(e){ toast('Could not reopen this vote: ' + rpcErrorMessage(e, 'please try again.')); });
  }

  // Plain browser download — the Claude-artifact "downloads" capability
  // doesn't exist outside claude.ai, so this now builds a real
  // Blob/ObjectURL download link instead of calling claude.use('downloads').
  function exportResultsCsv(poll){
    var res = S.pollResults[poll.id];
    if(!res) return;
    var rows = [['Option','Votes','Share of votes']];
    poll.options.forEach(function(o){
      var n = res.counts[o.id]||0;
      var pct = res.total ? Math.round(1000*n/res.total)/10 : 0;
      rows.push([o.label, n, pct + '%']);
    });
    rows.push([]); rows.push(['Total ballots cast', res.total]); rows.push(['Eligible verified residents', res.eligible]);
    var csv = rows.map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = slug(poll.title) + '-results.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  /* ---------------------------------------------------------------------
     Render — top-level router
  --------------------------------------------------------------------- */
  function render(){
    var root = document.getElementById('app');
    if(!S.currentUser){
      root.innerHTML = renderAuth();
      bindAuth();
      return;
    }
    if(S.view === 'issued'){
      root.innerHTML = renderIssued();
      bindIssued();
      return;
    }
    root.innerHTML = renderShell();
    bindShell();
  }

  /* ---------- Auth screens ---------- */
  // The old "local-only copy" banner is gone — every visitor now talks to
  // the same real Supabase backend, regardless of how they reached this
  // page (hosted link, downloaded file, GitHub Pages, wherever), so there's
  // no longer a "not synced with anyone else" mode to warn about.
  function renderAuth(){
    var tab = S.authTab;
    return '' +
    '<div class="auth-wrap">' +
      '<div class="auth-card">' +
        '<div class="auth-brand">' +
          '<div class="word">Vocal <em>STOON</em></div>' +
          '<div class="tag">Resident budget voting for the ' + esc(MUNICIPALITY) + ' council</div>' +
        '</div>' +
        '<div class="card pad-lg">' +
          '<div class="auth-tabs">' +
            '<button class="auth-tab ' + (tab==='signin'?'active':'') + '" data-authtab="signin">Sign in</button>' +
            '<button class="auth-tab ' + (tab==='signup'?'active':'') + '" data-authtab="signup">Create account</button>' +
          '</div>' +
          (tab==='signin' ? renderSignIn() : renderSignUp()) +
        '</div>' +
        '<div class="banner" style="margin-top:14px;">This is an independent working prototype, not an official City of Saskatoon service. No real ID photos or biometric data are collected — identity verification is simulated. Votes are advisory input for council, not a binding tally.</div>' +

  function renderSignIn(){
    var last = getLastIdentity();
    return '' +
    '<form id="signinForm" class="form-stack" novalidate>' +
      '<div class="field"><label>Full name</label><input type="text" name="fullName" value="' + esc(last.fullName || '') + '" autocomplete="name" required></div>' +
      '<div class="field"><label>Street address</label><input type="text" name="address" value="' + esc(last.address || '') + '" placeholder="123 Spadina Cres" autocomplete="street-address" required></div>' +
      '<div class="field"><label>Ward / riding</label><select name="riding" required>' + RIDINGS.map(function(w){ return '<option' + (w === last.riding ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" autofocus required></div>' +
      (S.authError ? '<div class="err-msg">' + esc(S.authError) + '</div>' : '') +
      '<button type="submit" class="btn btn-primary btn-block" ' + (S.authBusy?'disabled':'') + '>' + (S.authBusy?'Signing in…':'Sign in') + '</button>' +
      '<div class="hint" style="text-align:center;">You\'ll re-confirm your identity after signing in — every time, not just the first.</div>' +
      '<div class="link-row">New resident? <button type="button" class="link-btn" id="toSignup">Create an account</button></div>' +
    '</form>';
  }

  function renderSignUp(){
    return '' +
    '<form id="signupForm" class="form-stack" novalidate>' +
      '<div class="field"><label>Full name</label><input type="text" name="fullName" required></div>' +
      '<div class="field"><label>Street address</label><input type="text" name="address" placeholder="123 Spadina Cres" required></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>City</label><input type="text" name="city" value="' + esc(MUNICIPALITY) + '"></div>' +
        '<div class="field"><label>Postal code</label><input type="text" name="postalCode"></div>' +
      '</div>' +
      '<div class="field"><label>Ward / riding</label><select name="riding" required>' + RIDINGS.map(function(w){ return '<option>' + esc(w) + '</option>'; }).join('') + '</select>' +
        '<div class="hint">Determines which ward-specific votes you\'ll see — council can limit a vote to just one or a few wards.</div></div>' +
      '<div class="field"><label>Choose a password</label><input type="password" name="password" minlength="6" placeholder="6+ characters" required></div>' +
      '<div class="hint" style="margin-top:-6px;">There\'s no username to choose — you\'ll sign back in with your full name, address, ward, and this password. It\'s a lightweight demo credential, not production-grade security.</div>' +
      (S.showCouncilCode ?
        '<div class="field"><label>Council access code</label><input type="text" name="councilCode" placeholder="Provided by municipal IT"></div>' :
        '<div class="link-row"><button type="button" class="link-btn" id="toggleCouncil">I\'m a council member</button></div>'
      ) +
      (S.authError ? '<div class="err-msg">' + esc(S.authError) + '</div>' : '') +
      '<button type="submit" class="btn btn-primary btn-block" ' + (S.authBusy?'disabled':'') + '>' + (S.authBusy?'Creating account…':'Create account') + '</button>' +
      '<div class="link-row">Already registered? <button type="button" class="link-btn" id="toSignin">Sign in</button></div>' +
    '</form>';
  }

  function bindAuth(){
    var signinBtn = document.getElementById('toSignup');
    if(signinBtn) signinBtn.onclick = function(){ S.authTab='signup'; S.authError=''; render(); };
    var toSignin = document.getElementById('toSignin');
    if(toSignin) toSignin.onclick = function(){ S.authTab='signin'; S.authError=''; render(); };
    var tabs = document.querySelectorAll('.auth-tab');
    tabs.forEach(function(t){ t.onclick = function(){ S.authTab = t.getAttribute('data-authtab'); S.authError=''; render(); }; });
    var toggleCouncil = document.getElementById('toggleCouncil');
    if(toggleCouncil) toggleCouncil.onclick = function(){
      // Reveal the code field in place, without a full re-render, so any
      // fields already filled in above are not wiped out.
      S.showCouncilCode = true;
      var wrapper = toggleCouncil.closest('.link-row');
      var field = document.createElement('div');
      field.className = 'field';
      field.innerHTML = '<label>Council access code</label><input type="text" name="councilCode" placeholder="Provided by municipal IT">';
      wrapper.replaceWith(field);
    };

    var signinForm = document.getElementById('signinForm');
    if(signinForm) signinForm.onsubmit = function(e){
      e.preventDefault(); var f = new FormData(signinForm);
      doSignIn({ fullName:f.get('fullName'), address:f.get('address'), riding:f.get('riding'), password:f.get('password') });
    };
    var signupForm = document.getElementById('signupForm');
    if(signupForm) signupForm.onsubmit = function(e){
      e.preventDefault(); var f = new FormData(signupForm);
      doSignUp({ fullName:f.get('fullName'), address:f.get('address'), city:f.get('city'), postalCode:f.get('postalCode'), riding:f.get('riding'), password:f.get('password'), councilCode:f.get('councilCode') });
    };
  }

  /* ---------- One-time "save your resident ID" interstitial ---------- */
  function renderIssued(){
    return '' +
    '<div class="auth-wrap">' +
      '<div class="auth-card">' +
        '<div class="auth-brand">' +
          '<div class="word">Vocal <em>STOON</em></div>' +
        '</div>' +
        '<div class="card pad-lg" style="text-align:center;">' +
          '<h2 style="margin-top:0;">Your resident ID</h2>' +
          '<p style="color:var(--ink-2); font-size:14px;">This system-issued ID is your account\'s internal reference — council can look you up by it if you ever need support. You don\'t need it to sign in: just use your full name, address, ward, and password, and you\'ll re-confirm your identity every time.</p>' +
          '<div class="mono" style="font-size:24px; font-weight:600; letter-spacing:.03em; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; margin:18px 0;">' + esc(S.issuedId) + '</div>' +
          '<button class="btn btn-ghost btn-block" id="copyIssuedId" style="margin-bottom:10px;">Copy ID</button>' +
          '<button class="btn btn-primary btn-block" id="continueAfterIssued">Continue</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function bindIssued(){
    var btn = document.getElementById('continueAfterIssued');
    if(btn) btn.onclick = afterLogin;
    var copyBtn = document.getElementById('copyIssuedId');
    if(copyBtn) copyBtn.onclick = function(){
      var id = S.issuedId;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(id).then(function(){ toast('Copied.'); }, function(){ toast('Could not copy — select the ID and copy it manually.'); });
      } else { toast('Could not copy — select the ID and copy it manually.'); }
    };
  }

  /* ---------- Shell (post-login) ---------- */
  function renderShell(){
    var u = S.currentUser;
    var isCouncil = u.role === 'council';
    var openCount = S.polls.filter(function(p){ return p.status==='open' && !S.myBallots[p.id] && (isCouncil || pollVisibleToResident(p, u)); }).length;
    var pendingVerCount = isCouncil ? S.residents.filter(function(r){ return r.role==='resident' && r.verificationStatus==='pending'; }).length : 0;

    var nav = '';
    if(isCouncil){
      nav += navItem('council-new', 'Open a New Vote', S.view==='council' && S.councilTab==='new');
      nav += navItem('council-manage', 'Manage Votes', S.view==='council' && S.councilTab==='manage');
      nav += navItem('council-verify', 'Resident Verifications', S.view==='council' && S.councilTab==='verify', pendingVerCount);
    } else {
      nav += navItem('resident', 'Votes for You', S.view==='resident' || S.view==='vote', openCount);
      nav += navItem('history', 'History & Results', S.view==='history');
    }

    var title = 'Vocal STOON'; var desc='';
    if(!isCouncil && S.view==='resident'){ title='Votes for You'; desc='Budget decisions the ' + MUNICIPALITY + ' council needs your input on.'; }
    if(!isCouncil && S.view==='history'){ title='History & Results'; desc='Every item you\'ve voted on, and how each closed.'; }
    if(!isCouncil && S.view==='vote'){ title='Cast Your Vote'; desc=''; }
    if(!isCouncil && S.view==='verify'){ title='Verify Your Residency'; desc=''; }
    if(isCouncil && S.councilTab==='new'){ title='Open a New Vote'; desc='Put a budget decision to ' + MUNICIPALITY + ' residents.'; }
    if(isCouncil && S.councilTab==='manage'){ title='Manage Votes'; desc='Track turnout and review results as council needs them.'; }
    if(isCouncil && S.councilTab==='verify'){ title='Resident Verifications'; desc='Review residency applications and the resident roster.'; }

    var notifBell = isCouncil ? '' : renderNotifBell();

    return '' +
    '<div class="shell">' +
      '<aside class="sidebar">' +
        '<div class="brand"><div class="word">Vocal <em>STOON</em></div><div class="sub">' + esc(MUNICIPALITY) + '</div></div>' +
        '<nav class="nav">' + nav + '</nav>' +
        '<div class="sidebar-foot">' +
          '<div class="who"><div class="name">' + esc(u.fullName) + '</div><div class="role">' + (isCouncil ? 'Council access' : 'Verified resident') + '</div></div>' +
          '<button class="btn btn-ghost btn-block btn-sm" id="signOutBtn">Sign out</button>' +
        '</div>' +
      '</aside>' +
      '<div class="main">' +
        '<div class="topbar"><div><h1>' + esc(title) + '</h1>' + (desc?'<div class="desc">'+esc(desc)+'</div>':'') + '</div>' + notifBell + '</div>' +
        '<div class="content">' + renderMainContent(isCouncil) + '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------- Resident: notification bell ---------- */
  function renderNotifBell(){
    var unread = S.notifications.length;
    return '' +
    '<div class="notif-wrap">' +
      '<button class="notif-bell" id="notifBellBtn" type="button" aria-label="Notifications">🔔' +
        (unread ? '<span class="notif-badge">' + (unread > 9 ? '9+' : unread) + '</span>' : '') +
      '</button>' +
      (S.notifOpen ? renderNotifPanel() : '') +
    '</div>';
  }

  function renderNotifPanel(){
    return '' +
    '<div class="card notif-panel">' +
      '<div class="notif-panel-head"><h3>New votes</h3>' +
        (S.notifications.length ? '<button type="button" class="link-btn" id="notifMarkAllRead">Mark all read</button>' : '') +
      '</div>' +
      (S.notifications.length ? S.notifications.map(function(p){
        return '<button type="button" class="notif-item" data-notifopen="' + p.id + '">' +
          '<div class="notif-title">' + esc(p.title) + '</div>' +
          '<div class="notif-sub">' + esc(pollAreaLabel(p)) + ' · opened ' + fmtDateTime(p.createdAt) + '</div>' +
        '</button>';
      }).join('') : '<div class="empty" style="padding:22px 10px;">No new votes right now.</div>') +
    '</div>';
  }

  function navItem(key, label, active, badge){
    return '<button class="nav-item ' + (active?'active':'') + '" data-nav="' + key + '"><span>' + esc(label) + '</span>' + (badge ? '<span class="nav-badge">'+badge+'</span>' : '') + '</button>';
  }

  function renderMainContent(isCouncil){
    if(!isCouncil){
      if(S.view==='verify') return renderVerify();
      if(S.view==='vote') return renderVoteScreen();
      if(S.view==='history') return renderHistory();
      return renderResidentDashboard();
    } else {
      if(S.councilTab==='new') return renderCouncilNew();
      if(S.councilTab==='verify') return renderCouncilVerify();
      return renderCouncilManage();
    }
  }

  /* ---------- Resident: verification ---------- */
  function renderVerify(){
    var step = S.verifyStep;
    var alreadyVerified = S.currentUser.verificationStatus === 'verified';
    function stepClass(n){ return step > n ? 'done' : (step === n ? 'active' : ''); }
    function stepIcon(n){ return step > n ? '✓' : n; }
    return '' +
    '<div class="card pad-lg" style="max-width:560px;">' +
      '<h2 style="margin-top:0;">' + (alreadyVerified ? 'Confirming it\'s you' : 'One more step before you can vote') + '</h2>' +
      '<p style="color:var(--ink-2); font-size:14px;">' + (alreadyVerified ?
        esc(MUNICIPALITY) + ' re-confirms your identity on every sign-in before showing your ballot — simulated end-to-end, same as at signup, and starting automatically now.' :
        esc(MUNICIPALITY) + ' verifies that every vote comes from a real resident of the jurisdiction. In this prototype, the check below is simulated end-to-end — no photo, document scan, or biometric data is actually captured or stored.') +
      '</p>' +
      '<div class="verify-steps">' +
        '<div class="vstep ' + stepClass(1) + '"><div class="vicon">' + stepIcon(1) + '</div><div><div class="vtext">Residency document check</div><div class="vsub">Confirms your submitted address falls within ' + esc(MUNICIPALITY) + '</div></div></div>' +
        '<div class="vstep ' + stepClass(2) + '"><div class="vicon">' + stepIcon(2) + '</div><div><div class="vtext">Biometric liveness match</div><div class="vsub">Confirms one verified account per resident</div></div></div>' +
      '</div>' +
      (step===0 && !alreadyVerified ? '<button class="btn btn-primary" id="beginVerifyBtn">Begin verification</button>' : '') +
      (step===3 ? '<div class="chip chip-good"><span class="chip-dot"></span>Verified — taking you to your dashboard…</div>' : '') +
      (!alreadyVerified ? '<div class="disclosure" style="margin-top:16px;">Prefer a human review instead? Your application is also visible to council staff, who can approve it directly from the Resident Verifications queue.</div>' : '') +
    '</div>';
  }

  /* ---------- Resident: dashboard ---------- */
  function renderResidentDashboard(){
    var visible = S.polls.filter(function(p){ return pollVisibleToResident(p, S.currentUser); });
    var open = visible.filter(function(p){ return p.status==='open' && !S.myBallots[p.id]; });
    var votedOpen = visible.filter(function(p){ return p.status==='open' && S.myBallots[p.id]; });
    var html = '';
    html += '<section><div class="section-head"><h2>Needs your vote</h2><span class="count">' + open.length + ' open</span></div>';
    html += open.length ? open.map(function(p){ return renderResidentPollCard(p, false); }).join('') : '<div class="empty">No open votes right now — check back after council opens a new item.</div>';
    html += '</section>';
    if(votedOpen.length){
      html += '<section><div class="section-head"><h2>Awaiting close</h2><span class="count">you\'ve voted</span></div>';
      html += votedOpen.map(function(p){ return renderResidentPollCard(p, true); }).join('');
      html += '</section>';
    }
    return html;
  }

  function renderResidentPollCard(p, voted){
    var d = daysLeft(p.closesAt);
    var dueTxt = d===null ? '' : (d < 0 ? 'Past due' : d===0 ? 'Closes today' : d + ' day' + (d===1?'':'s') + ' left');
    return '' +
    '<div class="card poll-card">' +
      '<div class="poll-top">' +
        '<div><div class="poll-title">' + esc(p.title) + '</div>' +
        '<div class="poll-meta"><span class="chip chip-neutral"><span class="chip-dot"></span>' + esc(p.category) + '</span>' +
        '<span class="chip chip-neutral"><span class="chip-dot"></span>' + esc(pollAreaLabel(p)) + '</span><span>' + esc(dueTxt) + '</span></div></div>' +
        '<div class="poll-budget">' + fmtMoney(p.budgetAmount) + '</div>' +
      '</div>' +
      '<div class="poll-desc">' + esc(p.description) + '</div>' +
      '<div class="poll-actions">' +
        (voted ? '<span class="chip chip-accent"><span class="chip-dot"></span>Vote recorded</span>' : '<button class="btn btn-primary" data-openvote="' + p.id + '">Cast your vote</button>') +
      '</div>' +
    '</div>';
  }

  function renderVoteScreen(){
    var p = S.polls.filter(function(x){ return x.id === S.activePollId; })[0];
    if(!p) return '<div class="empty">This vote is no longer available.</div><button class="btn btn-ghost" data-back="resident">Back</button>';
    if(!pollVisibleToResident(p, S.currentUser)) return '<div class="empty">This vote is not open to your ward.</div><button class="btn btn-ghost" data-back="resident">Back</button>';
    var d = daysLeft(p.closesAt);
    return '' +
    '<div class="card pad-lg" style="max-width:640px;">' +
      '<div class="poll-meta" style="margin-bottom:6px;"><span class="chip chip-neutral"><span class="chip-dot"></span>' + esc(p.category) + '</span>' +
      '<span class="chip chip-neutral"><span class="chip-dot"></span>' + esc(pollAreaLabel(p)) + '</span><span>' + (d!==null && d>=0 ? d + ' day' + (d===1?'':'s') + ' left' : '') + '</span></div>' +
      '<h2 class="poll-title" style="font-size:23px;">' + esc(p.title) + '</h2>' +
      '<div class="poll-budget" style="margin-bottom:10px;">' + fmtMoney(p.budgetAmount) + ' proposed</div>' +
      '<p style="color:var(--ink-2); font-size:14.5px; line-height:1.6;">' + esc(p.description) + '</p>' +
      '<div class="options-grid" style="margin:18px 0;">' +
        p.options.map(function(o){
          var sel = S.selectedOptionId === o.id;
          return '<div class="opt-card ' + (sel?'selected':'') + '" data-selopt="' + o.id + '"><div class="opt-head"><span class="opt-radio"></span><span class="opt-label">' + esc(o.label) + '</span></div></div>';
        }).join('') +
      '</div>' +
      '<div class="poll-actions">' +
        '<button class="btn btn-primary" id="submitVoteBtn" ' + ((S.selectedOptionId && !S.voteBusy)?'':'disabled') + '>' + (S.voteBusy?'Submitting…':'Submit vote') + '</button>' +
        '<button class="btn btn-ghost" data-back="resident">Cancel</button>' +
      '</div>' +
    '</div>';
  }

  function renderHistory(){
    var mine = S.polls.filter(function(p){ return (S.myBallots[p.id] || p.status==='closed') && pollVisibleToResident(p, S.currentUser); });
    if(!mine.length) return '<div class="empty">Nothing here yet — items you\'ve voted on will appear once you cast a vote.</div>';
    return mine.map(function(p){
      var ballot = S.myBallots[p.id];
      var res = S.pollResults[p.id];
      var body = '<div class="card poll-card">' +
        '<div class="poll-top"><div><div class="poll-title">' + esc(p.title) + '</div>' +
        '<div class="poll-meta"><span class="chip chip-neutral"><span class="chip-dot"></span>' + esc(p.category) + '</span>' +
        '<span class="chip ' + (p.status==='closed'?'chip-neutral':'chip-accent') + '"><span class="chip-dot"></span>' + (p.status==='closed'?'Closed '+fmtDate(p.closedAt):'Open') + '</span></div></div>' +
        '<div class="poll-budget">' + fmtMoney(p.budgetAmount) + '</div></div>' +
        (ballot ? '<div class="chip chip-good" style="width:fit-content;"><span class="chip-dot"></span>You voted: ' + esc((p.options.filter(function(o){return o.id===ballot.optionId;})[0]||{}).label || '—') + '</div>' : '<div class="chip chip-neutral" style="width:fit-content;"><span class="chip-dot"></span>You did not vote</div>');
      if(p.status==='closed'){
        body += res ? renderBars(p, res) : '<button class="btn btn-ghost btn-sm" data-loadresults="' + p.id + '">Show results</button>';
      }
      body += '</div>';
      return body;
    }).join('');
  }

  /* ---------- Shared: results bar chart ---------- */
  function renderBars(p, res){
    var total = res.total || 0;
    var html = '<div style="margin-top:14px;">';
    p.options.forEach(function(o, i){
      var n = res.counts[o.id] || 0;
      var pct = total ? Math.round(1000*n/total)/10 : 0;
      html += '<div class="bar-row"><div class="lbl">' + esc(o.label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + (total? Math.max(pct,1.5):0) + '%; background:' + CAT_COLORS[i % CAT_COLORS.length] + ';"></div></div>' +
        '<div class="bar-pct tnum">' + n + ' (' + pct + '%)</div></div>';
    });
    var turnoutPct = res.eligible ? Math.round(100*total/res.eligible) : 0;
    html += '<div style="display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12.5px; color:var(--ink-2);">' +
      '<span class="mono tnum">' + total + ' of ' + res.eligible + ' verified residents</span>' +
      '<div class="turnout-track"><div class="turnout-fill" style="width:' + turnoutPct + '%;"></div></div>' +
      '<span class="mono tnum">' + turnoutPct + '%</span></div>';
    html += '</div>';
    return html;
  }

  /* ---------- Council: create ---------- */
  function renderCouncilNew(){
    var optsHtml = S.newPollOptions.map(function(v, i){
      return '<div class="dyn-opt-row"><input type="text" data-optidx="' + i + '" value="' + esc(v) + '" placeholder="Option ' + (i+1) + '">' +
        (S.newPollOptions.length > 2 ? '<button type="button" class="icon-btn" data-removeopt="' + i + '">&times;</button>' : '') + '</div>';
    }).join('');
    return '' +
    '<form id="newPollForm" class="card pad-lg form-stack" style="max-width:640px;" novalidate>' +
      '<div class="field"><label>Title</label><input type="text" name="title" placeholder="Riverside Park playground upgrade" required></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Category</label><select name="category">' +
          ['Infrastructure','Parks & Recreation','Arts & Culture','Public Safety','Transportation','Housing','General'].map(function(c){ return '<option>' + c + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>Proposed budget (USD)</label><input type="number" name="budgetAmount" min="0" step="1000" placeholder="150000" required></div>' +
      '</div>' +
      '<div class="field"><label>Description</label><textarea name="description" placeholder="What council is deciding, and why residents\' input matters here." required></textarea></div>' +
      '<div class="field"><label>Voting options</label><div class="dyn-opts" id="dynOpts">' + optsHtml + '</div>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="addOptBtn" style="align-self:flex-start;">+ Add option</button></div>' +
      '<div class="field"><label>Who can vote</label>' +
        '<div style="display:flex; gap:18px; align-items:center;">' +
          '<label style="display:flex; align-items:center; gap:7px; font-weight:400; font-size:14px; cursor:pointer;"><input type="radio" name="ridingScope" value="all" id="scopeAll" checked> All of ' + esc(MUNICIPALITY) + '</label>' +
          '<label style="display:flex; align-items:center; gap:7px; font-weight:400; font-size:14px; cursor:pointer;"><input type="radio" name="ridingScope" value="specific" id="scopeSpecific"> Specific ward(s)</label>' +
        '</div>' +
        '<div class="options-grid" id="ridingChecks" hidden style="margin-top:8px;">' +
          RIDINGS.map(function(w){
            return '<label class="opt-card" style="flex-direction:row; align-items:center; gap:9px; cursor:pointer;"><input type="checkbox" name="ridings" value="' + esc(w) + '"><span class="opt-label">' + esc(w) + '</span></label>';
          }).join('') +
        '</div>' +
        '<div class="hint">Restricting a vote hides it entirely from residents outside the selected ward(s) — it won\'t appear on their dashboard at all.</div>' +
      '</div>' +
      '<div class="field"><label>Voting closes</label><input type="datetime-local" name="closesAt" required></div>' +
      '<button type="submit" class="btn btn-primary" style="align-self:flex-start;">Publish vote to residents</button>' +
    '</form>';
  }

  /* ---------- Council: manage ---------- */
  function renderCouncilManage(){
    if(!S.polls.length) return '<div class="empty">No votes have been opened yet. Use "Open a New Vote" to publish the first one.</div>';
    return S.polls.map(function(p){
      var res = S.pollResults[p.id];
      var expanded = S.expandedResults[p.id];
      var turnoutPct = res && res.eligible ? Math.round(100*res.total/res.eligible) : null;
      return '<div class="card poll-card">' +
        '<div class="poll-top"><div><div class="poll-title">' + esc(p.title) + '</div>' +
        '<div class="poll-meta"><span class="chip chip-neutral"><span class="chip-dot"></span>' + esc(p.category) + '</span>' +
        '<span class="chip chip-neutral"><span class="chip-dot"></span>' + esc(pollAreaLabel(p)) + '</span>' +
        '<span class="chip ' + (p.status==='open'?'chip-accent':'chip-neutral') + '"><span class="chip-dot"></span>' + (p.status==='open' ? 'Open · closes ' + fmtDateTime(p.closesAt) : 'Closed ' + fmtDate(p.closedAt)) + '</span></div></div>' +
        '<div class="poll-budget">' + fmtMoney(p.budgetAmount) + '</div></div>' +
        '<div class="poll-desc">' + esc(p.description) + '</div>' +
        (res ? '<div style="font-size:12.5px; color:var(--ink-2);"><span class="mono tnum">' + res.total + '</span> ballots cast so far · <span class="mono tnum">' + (turnoutPct===null?'—':turnoutPct+'%') + '</span> of ' + res.eligible + ' eligible verified residents</div>' : '') +
        '<div class="poll-actions">' +
          '<button class="btn btn-ghost btn-sm" data-refreshresults="' + p.id + '">' + (expanded ? 'Refresh results' : 'View results') + '</button>' +
          (p.status==='open' ? '<button class="btn btn-danger btn-sm" data-closepoll="' + p.id + '">Close voting</button>' : '<button class="btn btn-ghost btn-sm" data-reopenpoll="' + p.id + '">Reopen</button>') +
          (res ? '<button class="btn btn-ghost btn-sm" data-exportcsv="' + p.id + '">Export CSV</button>' : '') +
        '</div>' +
        (expanded && res ? renderBars(p, res) : '') +
      '</div>';
    }).join('');
  }

  /* ---------- Council: verifications ---------- */
  function renderCouncilVerify(){
    var pending = S.residents.filter(function(r){ return r.role==='resident' && r.verificationStatus==='pending'; });
    var others = S.residents.filter(function(r){ return r.verificationStatus !== 'pending'; });
    var html = '';
    html += '<section><div class="section-head"><h2>Pending applications</h2><span class="count">' + pending.length + '</span></div>';
    html += pending.length ? pending.map(function(r){
      return '<div class="card pad-md" style="display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:10px; flex-wrap:wrap;">' +
        '<div><div style="font-weight:700;">' + esc(r.fullName) + ' <span class="mono" style="color:var(--ink-muted); font-weight:400; font-size:12.5px;">' + esc(r.id) + '</span></div>' +
        '<div style="font-size:13px; color:var(--ink-2);">' + esc(r.address) + ', ' + esc(r.city) + '</div>' +
        '<div style="font-size:12px; color:var(--ink-muted);">' + esc(r.riding || 'Ward not on file') + ' · Applied ' + fmtDate(r.submittedAt) + '</div></div>' +
        '<div class="poll-actions"><button class="btn btn-primary btn-sm" data-approve="' + r.id + '">Approve</button><button class="btn btn-danger btn-sm" data-reject="' + r.id + '">Reject</button></div>' +
      '</div>';
    }).join('') : '<div class="empty">No pending applications.</div>';
    html += '</section>';

    html += '<section><div class="section-head"><h2>Resident roster</h2><span class="count">' + others.length + '</span></div>';
    html += '<div class="card pad-md scroll-x"><table class="roster"><thead><tr><th>Name</th><th>Resident ID</th><th>Address</th><th>Ward</th><th>Role</th><th>Status</th></tr></thead><tbody>' +
      (others.length ? others.map(function(r){
        var chip = r.role==='council' ? '<span class="chip chip-accent"><span class="chip-dot"></span>Council</span>' :
          r.verificationStatus==='verified' ? '<span class="chip chip-good"><span class="chip-dot"></span>Verified</span>' :
          '<span class="chip chip-critical"><span class="chip-dot"></span>Rejected</span>';
        return '<tr><td>' + esc(r.fullName) + '</td><td class="mono">' + esc(r.id) + '</td><td>' + esc(r.address) + '</td><td>' + esc(r.riding || '—') + '</td><td>' + (r.role==='council'?'Council':'Resident') + '</td><td>' + chip + '</td></tr>';
      }).join('') : '<tr><td colspan="6" style="color:var(--ink-muted);">No other accounts yet.</td></tr>') +
      '</tbody></table></div></section>';
    return html;
  }

  /* ---------------------------------------------------------------------
     Bind events for post-login shell (re-bound on every render)
  --------------------------------------------------------------------- */
  function bindShell(){
    var signOutBtn = document.getElementById('signOutBtn');
    if(signOutBtn) signOutBtn.onclick = doSignOut;

    document.querySelectorAll('[data-nav]').forEach(function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute('data-nav');
        if(key==='resident'){ S.view='resident'; }
        else if(key==='history'){ S.view='history'; }
        else if(key==='council-new'){ S.view='council'; S.councilTab='new'; }
        else if(key==='council-manage'){ S.view='council'; S.councilTab='manage'; }
        else if(key==='council-verify'){ S.view='council'; S.councilTab='verify'; }
        render();
      };
    });

    var beginVerifyBtn = document.getElementById('beginVerifyBtn');
    if(beginVerifyBtn) beginVerifyBtn.onclick = beginVerification;

    var notifBellBtn = document.getElementById('notifBellBtn');
    if(notifBellBtn) notifBellBtn.onclick = function(){ S.notifOpen = !S.notifOpen; render(); };
    var notifMarkAllRead = document.getElementById('notifMarkAllRead');
    if(notifMarkAllRead) notifMarkAllRead.onclick = function(){
      markNotifsSeen(S.currentUser.id, S.notifications.map(function(p){ return p.id; }));
      S.notifications = []; S.notifOpen = false; render();
    };
    document.querySelectorAll('[data-notifopen]').forEach(function(btn){
      btn.onclick = function(){
        var pollId = btn.getAttribute('data-notifopen');
        markNotifsSeen(S.currentUser.id, [pollId]);
        S.notifications = S.notifications.filter(function(p){ return p.id !== pollId; });
        S.notifOpen = false;
        var poll = S.polls.filter(function(p){ return p.id === pollId; })[0];
        if(poll && poll.status === 'open' && pollVisibleToResident(poll, S.currentUser) && !S.myBallots[pollId]){
          S.activePollId = pollId; S.selectedOptionId = null; S.view = 'vote';
        } else {
          S.view = 'resident';
        }
        render();
      };
    });

    document.querySelectorAll('[data-openvote]').forEach(function(btn){
      btn.onclick = function(){ S.activePollId = btn.getAttribute('data-openvote'); S.selectedOptionId = null; S.view = 'vote'; render(); };
    });
    document.querySelectorAll('[data-back]').forEach(function(btn){
      btn.onclick = function(){ S.view = btn.getAttribute('data-back'); render(); };
    });
    document.querySelectorAll('[data-selopt]').forEach(function(btn){
      btn.onclick = function(){ S.selectedOptionId = btn.getAttribute('data-selopt'); render(); };
    });
    var submitVoteBtn = document.getElementById('submitVoteBtn');
    if(submitVoteBtn) submitVoteBtn.onclick = function(){ castVote(S.activePollId, S.selectedOptionId); };

    document.querySelectorAll('[data-loadresults]').forEach(function(btn){
      btn.onclick = function(){ computeResults(btn.getAttribute('data-loadresults')); };
    });
    document.querySelectorAll('[data-refreshresults]').forEach(function(btn){
      btn.onclick = function(){ var id = btn.getAttribute('data-refreshresults'); S.expandedResults[id] = true; computeResults(id); };
    });
    document.querySelectorAll('[data-closepoll]').forEach(function(btn){
      btn.onclick = function(){ closePoll(btn.getAttribute('data-closepoll')); };
    });
    document.querySelectorAll('[data-reopenpoll]').forEach(function(btn){
      btn.onclick = function(){ reopenPoll(btn.getAttribute('data-reopenpoll')); };
    });
    document.querySelectorAll('[data-exportcsv]').forEach(function(btn){
      btn.onclick = function(){ var p = S.polls.filter(function(x){return x.id===btn.getAttribute('data-exportcsv');})[0]; if(p) exportResultsCsv(p); };
    });

    document.querySelectorAll('[data-approve]').forEach(function(btn){ btn.onclick = function(){ councilSetVerification(btn.getAttribute('data-approve'), 'verified'); }; });
    document.querySelectorAll('[data-reject]').forEach(function(btn){ btn.onclick = function(){ councilSetVerification(btn.getAttribute('data-reject'), 'rejected'); }; });

    var newPollForm = document.getElementById('newPollForm');
    if(newPollForm){
      newPollForm.onsubmit = function(e){
        e.preventDefault();
        var f = new FormData(newPollForm);
        var opts = Array.prototype.map.call(document.querySelectorAll('[data-optidx]'), function(inp){ return inp.value; });
        var ridings = Array.prototype.map.call(document.querySelectorAll('input[name="ridings"]:checked'), function(cb){ return cb.value; });
        createPoll({ title:f.get('title'), category:f.get('category'), budgetAmount:f.get('budgetAmount'), description:f.get('description'), options:opts, ridingScope:f.get('ridingScope'), ridings:ridings, closesAt:f.get('closesAt') });
      };
      // The ward checklist only matters once "Specific ward(s)" is picked —
      // toggled by direct DOM manipulation (not render()) so nothing typed
      // above gets wiped, same reasoning as the option rows below.
      var scopeAll = document.getElementById('scopeAll');
      var scopeSpecific = document.getElementById('scopeSpecific');
      var ridingChecks = document.getElementById('ridingChecks');
      if(scopeAll && scopeSpecific && ridingChecks){
        scopeAll.onchange = function(){ if(scopeAll.checked) ridingChecks.hidden = true; };
        scopeSpecific.onchange = function(){ if(scopeSpecific.checked) ridingChecks.hidden = false; };
      }
      // Voting-option rows are added/removed by direct DOM manipulation
      // (never a full render()) so that title/category/budget/description,
      // already typed above, are never wiped out mid-edit.
      var addOptBtn = document.getElementById('addOptBtn');
      if(addOptBtn) addOptBtn.onclick = function(){
        var wrap = document.getElementById('dynOpts');
        var rows = wrap.querySelectorAll('.dyn-opt-row');
        if(rows.length >= 6){ toast('Up to 6 options.'); return; }
        var row = document.createElement('div');
        row.className = 'dyn-opt-row';
        var inp = document.createElement('input');
        inp.type = 'text'; inp.setAttribute('data-optidx', rows.length);
        inp.placeholder = 'Option ' + (rows.length + 1);
        var rm = document.createElement('button');
        rm.type = 'button'; rm.className = 'icon-btn'; rm.innerHTML = '&times;';
        rm.onclick = function(){
          if(wrap.querySelectorAll('.dyn-opt-row').length <= 2){ toast('At least two options are required.'); return; }
          row.remove();
        };
        row.appendChild(inp); row.appendChild(rm);
        wrap.appendChild(row);
      };
    }
  }

  /* ---------------------------------------------------------------------
     Boot
     Session restore now means: is there a still-valid session token saved
     locally? If so, hand it straight to get_my_profile() (0001_init.sql)
     to fetch the resident's own row — no password re-entry needed. An
     expired or missing token just lands on the sign-in screen, which fits
     the app's existing "re-verify identity every sign-in" design intent
     anyway.
  --------------------------------------------------------------------- */
  function boot(){
    var saved = readSession();
    if(sessionLooksValid(saved)){
      setSession(saved.token, saved.expiresAt);
      sb.rpc('get_my_profile', withToken()).then(function(res){
        if(res.error || !res.data){ setSession(null); render(); return; }
        S.currentUser = rowToResident(res.data);
        afterLogin();
      }).catch(function(){ setSession(null); render(); });
    } else {
      setSession(null); // clears any leftover expired session
      render();
    }
  }

  render(); // paint the auth screen immediately (S.currentUser is null until boot() proves otherwise)
  boot();
})();
</script>
